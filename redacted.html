<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>[REDACTED]</title>

<style>
*{box-sizing:border-box}

body{
margin:0;
min-height:100vh;
display:grid;
place-items:center;
background:#050505;
color:#ddd;
font-family:monospace
}

.box{
width:min(760px,90vw);
border:1px solid #292929;
padding:35px;
background:#090909;
box-shadow:0 0 50px #000
}

.top{
color:#555;
font-size:12px;
letter-spacing:3px;
margin-bottom:25px
}

h1{
margin:0;
font-size:clamp(42px,10vw,90px);
letter-spacing:10px;
color:#eee
}

.line{
height:1px;
background:#292929;
margin:25px 0
}

p{
color:#777;
line-height:1.7
}

#terminal{
margin-top:25px;
color:#777;
min-height:95px;
white-space:pre-line
}

button{
margin-top:25px;
padding:14px 22px;
border:1px solid #555;
background:#eee;
color:#050505;
font:inherit;
cursor:pointer
}

button:hover{
background:#ccc
}

.hidden{
display:none
}
</style>
</head>

<body>

<div class="box">

<div class="top">
ARCHIVE // UNAUTHORIZED NODE
</div>

<h1>[REDACTED]</h1>

<div class="line"></div>

<p>
You were not supposed to find this.
</p>

<p>
The previous file was a distraction. This one is not.
</p>

<div id="terminal"></div>

<div id="continue" class="hidden">
<button onclick="enter()">ENTER</button>
</div>

</div>


<script>

/*
   Temporary unlock.

   sessionStorage belongs to this browser tab.
   Closing the tab removes the unlock.
*/

if(sessionStorage.getItem('ringerUnlocked')!=='1'){

document.body.innerHTML='';

location.replace('index.html');

}


const text=`SIGNAL DETECTED
VIDEO COMPLETION CONFIRMED

RINGER PROTOCOL INITIALIZED.`;

let i=0;


function type(){

if(i<text.length){

document.getElementById(
'terminal'
).textContent+=text[i++];

setTimeout(type,24);

}else{

document
.getElementById('continue')
.classList
.remove('hidden');

}

}


function enter(){

location.href='ringer.html';

}


type();

</script>

</body>
</html>
