<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Math-Reviewer</title>

<style>
*{box-sizing:border-box}

html,body{
margin:0;
width:100%;
height:100%;
overflow:hidden;
background:#202124;
font-family:'Segoe UI',Roboto,Arial,sans-serif;
color:#e8eaed
}

button{
font:inherit
}

/* =========================
   DRIVE PREVIEW
========================= */

#preview{
position:fixed;
inset:0;
display:flex;
flex-direction:column;
background:#202124;
z-index:10
}


/* =========================
   DESKTOP TOOLBAR
========================= */

#desktopBar{
height:64px;
display:flex;
align-items:center;
padding:0 18px;
gap:18px;
background:#2b2c2f;
border-bottom:1px solid #3c4043
}

#back{
width:42px;
height:42px;
border:0;
border-radius:50%;
background:transparent;
color:#e8eaed;
font-size:25px;
cursor:pointer;
display:grid;
place-items:center
}

#back:hover{
background:#3c4043
}

#fileIcon{
width:32px;
height:32px;
display:grid;
place-items:center;
background:#3c4043;
border-radius:4px;
flex-shrink:0
}

#fileIcon svg{
width:20px;
height:20px
}

#fileInfo{
min-width:0;
display:flex;
flex-direction:column;
justify-content:center
}

#filename{
font-size:15px;
white-space:nowrap;
overflow:hidden;
text-overflow:ellipsis;
color:#e8eaed
}

#filemeta{
font-size:12px;
color:#9aa0a6;
margin-top:2px
}

#desktopActions{
margin-left:auto;
display:flex;
align-items:center;
gap:4px
}

.action{
width:42px;
height:42px;
border:0;
border-radius:50%;
background:transparent;
color:#e8eaed;
cursor:pointer;
display:grid;
place-items:center
}

.action:hover{
background:#3c4043
}

.action svg{
width:21px;
height:21px
}


/* =========================
   MOBILE TOOLBAR
========================= */

#mobileBar{
display:none;
height:58px;
align-items:center;
padding:0 8px;
background:#202124;
border-bottom:1px solid #3c4043
}

#mobileBack{
width:42px;
height:42px;
border:0;
border-radius:50%;
background:transparent;
color:#e8eaed;
font-size:27px;
cursor:pointer;
display:grid;
place-items:center
}

#mobileBack:active{
background:#3c4043
}

#mobileName{
min-width:0;
flex:1;
font-size:15px;
white-space:nowrap;
overflow:hidden;
text-overflow:ellipsis;
margin-left:4px
}

.mobileAction{
width:42px;
height:42px;
border:0;
border-radius:50%;
background:transparent;
color:#e8eaed;
display:grid;
place-items:center;
cursor:pointer
}

.mobileAction:active{
background:#3c4043
}

.mobileAction svg{
width:21px;
height:21px
}


/* =========================
   PREVIEW AREA
========================= */

#body{
position:relative;
flex:1;
display:flex;
align-items:center;
justify-content:center;
background:#202124
}

#empty{
display:flex;
flex-direction:column;
align-items:center;
gap:15px;
color:#9aa0a6;
font-size:14px;
text-align:center
}

#thumb{
width:76px;
height:76px;
opacity:.65
}

#hint{
color:#7f8489;
font-size:12px
}


/* =========================
   PLAYER
========================= */

#player-container{
position:fixed;
inset:0;
z-index:40;
display:none;
align-items:center;
justify-content:center;
background:#000
}

#player-container.active{
display:flex
}

video{
display:block;
width:auto;
height:auto;
max-width:92vw;
max-height:88vh;
object-fit:contain;
background:#000
}


/* =========================
   REDACTED
========================= */

#redacted{
position:fixed;
right:24px;
bottom:24px;
z-index:100;
display:none
}

#redacted a{
display:block;
padding:12px 17px;
background:#111;
border:1px solid #444;
color:#888;
text-decoration:none;
font:12px monospace;
letter-spacing:2px;
transition:.15s
}

#redacted a:hover{
color:#fff;
border-color:#777;
background:#181818
}


/* =========================
   MORE MENU
========================= */

#moreMenu{
position:fixed;
right:18px;
top:58px;
z-index:200;
display:none;
width:190px;
padding:6px 0;
background:#303134;
border:1px solid #4b4c4f;
border-radius:4px;
box-shadow:0 8px 28px #0009
}

#moreMenu.show{
display:block
}

.menuItem{
width:100%;
padding:11px 16px;
border:0;
background:none;
color:#e8eaed;
text-align:left;
font-size:14px;
cursor:pointer
}

.menuItem:hover{
background:#3c4043
}


/* =========================
   TOAST
========================= */

#toast{
position:fixed;
left:50%;
bottom:28px;
transform:translateX(-50%);
z-index:300;
padding:10px 16px;
border-radius:4px;
background:#303134;
color:#e8eaed;
font-size:13px;
opacity:0;
pointer-events:none;
transition:opacity .2s
}

#toast.show{
opacity:1
}


/* =========================
   MOBILE
========================= */

@media(max-width:767px){

#desktopBar{
display:none
}

#mobileBar{
display:flex
}

#body{
background:#202124
}

#empty{
font-size:13px;
padding:20px
}

#thumb{
width:68px;
height:68px
}

#player-container{
background:#000
}

video{
width:100%;
height:auto;
max-width:100vw;
max-height:100vh;
object-fit:contain
}

#redacted{
right:14px;
bottom:14px
}

#redacted a{
padding:10px 13px;
font-size:11px
}

#moreMenu{
right:8px;
top:56px;
width:185px
}

}


/* =========================
   LARGE DESKTOP
========================= */

@media(min-width:1200px){

#desktopBar{
height:68px;
padding:0 24px
}

#body{
background:#202124
}

#empty{
font-size:15px
}

#thumb{
width:88px;
height:88px
}

}
</style>
</head>


<body>


<!-- =========================
     DRIVE PREVIEW
========================= -->

<div id="preview">


<!-- DESKTOP -->

<div id="desktopBar">

<button id="back" title="Back">
‹
</button>


<div id="fileIcon">

<svg viewBox="0 0 24 24" fill="#8ab4f8">
<path d="M8 5v14l11-7z"/>
</svg>

</div>


<div id="fileInfo">

<div id="filename">
Math_Reviewer.mp4
</div>

<div id="filemeta">
Video • 1 file
</div>

</div>


<div id="desktopActions">


<button class="action" id="printBtn" title="Print">

<svg viewBox="0 0 24 24" fill="currentColor">
<path d="M19 8H5c-1.66 0-3 1.34-3 3v6h4v4h12v-4h4v-6c0-1.66-1.34-3-3-3zm-3 11H8v-5h8v5zm3-7c-.55 0-1-.45-1-1s.45-1 1-1 1 .45 1 1-.45 1-1 1zM18 3H6v4h12V3z"/>
</svg>

</button>


<button class="action" id="shareBtn" title="Share">

<svg viewBox="0 0 24 24" fill="currentColor">
<path d="M18 16.08c-.76 0-1.44.3-1.96.77L8.91 12.7c.05-.23.09-.46.09-.7s-.04-.47-.09-.7l7.05-4.11c.54.5 1.25.81 2.04.81 1.66 0 3-1.34 3-3s-1.34-3-3-3-3 1.34-3 3c0 .24.04.47.09.7L7.04 9.81C6.5 9.31 5.79 9 5 9c-1.66 0-3 1.34-3 3s1.34 3 3 3c.79 0 1.5-.31 2.04-.81l7.12 4.16c-.05.21-.08.43-.08.65 0 1.61 1.31 2.92 2.92 2.92 1.61 0 2.92-1.31 2.92-2.92s-1.31-2.92-2.92-2.92z"/>
</svg>

</button>


<button class="action" id="downloadBtn" title="Download">

<svg viewBox="0 0 24 24" fill="currentColor">
<path d="M5 20h14v-2H5v2zM19 9h-4V3H9v6H5l7 7 7-7z"/>
</svg>

</button>


<button class="action" id="moreBtn" title="More">

<svg viewBox="0 0 24 24" fill="currentColor">
<path d="M12 8c1.1 0 2-.9 2-2s-.9-2-2-2-2 .9-2 2 .9 2 2 2zm0 2c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2zm0 6c0 1.1.9 2 2 2s2-.9 2-2-.9-2-2-2-2 .9-2 2z"/>
</svg>

</button>

</div>

</div>


<!-- MOBILE -->

<div id="mobileBar">

<button id="mobileBack" title="Back">
‹
</button>

<div id="mobileName">
Math_Reviewer.mp4
</div>


<button class="mobileAction" id="mobileShare" title="Share">

<svg viewBox="0 0 24 24" fill="currentColor">
<path d="M18 16.08c-.76 0-1.44.3-1.96.77L8.91 12.7c.05-.23.09-.46.09-.7s-.04-.47-.09-.7l7.05-4.11c.54.5 1.25.81 2.04.81 1.66 0 3-1.34 3-3s-1.34-3-3-3-3 1.34-3 3c0 .24.04.47.09.7L7.04 9.81C6.5 9.31 5.79 9 5 9c-1.66 0-3 1.34-3 3s1.34 3 3 3c.79 0 1.5-.31 2.04-.81l7.12 4.16c-.05.21-.08.43-.08.65 0 1.61 1.31 2.92 2.92 2.92 1.61 0 2.92-1.31 2.92-2.92s-1.31-2.92-2.92-2.92z"/>
</svg>

</button>


<button class="mobileAction" id="mobileMore" title="More">

<svg viewBox="0 0 24 24" fill="currentColor">
<path d="M12 8c1.1 0 2-.9 2-2s-.9-2-2-2-2 .9-2 2 .9 2 2 2zm0 2c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2zm0 6c0 1.1.9 2 2 2s2-.9 2-2-.9-2-2-2-2 2-2 2z"/>
</svg>

</button>

</div>


<!-- =========================
     PREVIEW BODY
========================= -->

<div id="body">

<div id="empty">

<svg id="thumb" viewBox="0 0 24 24" fill="#9aa0a6">
<path d="M8 5v14l11-7z"/>
</svg>

<div>
Preview unavailable
</div>

<div id="hint">
Tap download to view
</div>

</div>

</div>

</div>


<!-- =========================
     PLAYER
========================= -->

<div id="player-container">

<video
id="vid"
playsinline
preload="metadata">

<source
src="Rickroll.mp4"
type="video/mp4">

</video>

</div>


<!-- =========================
     REDACTED
========================= -->

<div id="redacted">

<a href="redacted.html">
[ REDACTED ]
</a>

</div>


<!-- =========================
     MORE MENU
========================= -->

<div id="moreMenu">

<button class="menuItem" id="menuDownload">
Download
</button>

<button class="menuItem" id="menuCopy">
Copy link
</button>

<button class="menuItem" id="menuReload">
Reload
</button>

</div>


<!-- =========================
     TOAST
========================= -->

<div id="toast"></div>


<script>

const preview=document.getElementById('preview');
const player=document.getElementById('player-container');
const vid=document.getElementById('vid');

const downloadBtn=document.getElementById('downloadBtn');
const printBtn=document.getElementById('printBtn');
const shareBtn=document.getElementById('shareBtn');
const moreBtn=document.getElementById('moreBtn');

const mobileShare=document.getElementById('mobileShare');
const mobileMore=document.getElementById('mobileMore');

const back=document.getElementById('back');
const mobileBack=document.getElementById('mobileBack');

const redacted=document.getElementById('redacted');
const moreMenu=document.getElementById('moreMenu');

const menuDownload=document.getElementById('menuDownload');
const menuCopy=document.getElementById('menuCopy');
const menuReload=document.getElementById('menuReload');

const toast=document.getElementById('toast');

let toastTimer;


/* =========================
   TOAST
========================= */

function showToast(text){

toast.textContent=text;
toast.classList.add('show');

clearTimeout(toastTimer);

toastTimer=setTimeout(()=>{
toast.classList.remove('show');
},1800);

}


/* =========================
   VIDEO
========================= */

function reveal(){

preview.style.display='none';

player.style.display='flex';
player.classList.add('active');

vid.currentTime=0;
vid.muted=false;

vid.play().catch(()=>{
vid.controls=true;
});

}


/* =========================
   DOWNLOAD / VIEW
========================= */

downloadBtn.addEventListener(
'click',
reveal
);

menuDownload.addEventListener(
'click',
()=>{
moreMenu.classList.remove('show');
reveal();
}
);


/* =========================
   SHARE
========================= */

async function sharePage(){

moreMenu.classList.remove('show');

try{

if(navigator.share){

await navigator.share({
title:'Math-Reviewer',
text:'Math-Reviewer',
url:location.href
});

}else{

await navigator.clipboard.writeText(
location.href
);

showToast('Link copied');

}

}catch(err){

if(err.name!=='AbortError'){

showToast('Unable to share');

}

}

}


shareBtn.addEventListener(
'click',
sharePage
);

mobileShare.addEventListener(
'click',
sharePage
);


/* =========================
   PRINT
========================= */

printBtn.addEventListener(
'click',
()=>{

moreMenu.classList.remove('show');

window.print();

}
);


/* =========================
   MORE
========================= */

function toggleMenu(){

moreMenu.classList.toggle('show');

}

moreBtn.addEventListener(
'click',
e=>{
e.stopPropagation();
toggleMenu();
}
);

mobileMore.addEventListener(
'click',
e=>{
e.stopPropagation();
toggleMenu();
}
);


/* =========================
   COPY
========================= */

menuCopy.addEventListener(
'click',
async()=>{

try{

await navigator.clipboard.writeText(
location.href
);

showToast('Link copied');

}catch{

showToast('Copy failed');

}

moreMenu.classList.remove('show');

}
);


/* =========================
   RELOAD
========================= */

menuReload.addEventListener(
'click',
()=>{

location.reload();

}
);


/* =========================
   CLOSE MENU
========================= */

document.addEventListener(
'click',
e=>{

if(
!moreMenu.contains(e.target)&&
e.target!==moreBtn&&
e.target!==mobileMore
){

moreMenu.classList.remove('show');

}

}
);


/* =========================
   BACK
========================= */

function goBack(){

if(
player.style.display==='flex'||
player.classList.contains('active')
){

vid.pause();

player.style.display='none';
player.classList.remove('active');

preview.style.display='flex';

}else{

if(history.length>1){

history.back();

}else{

showToast('No previous page');

}

}

}


back.addEventListener(
'click',
goBack
);

mobileBack.addEventListener(
'click',
goBack
);


/* =========================
   VIDEO COMPLETION
========================= */

vid.addEventListener(
'ended',
()=>{

localStorage.setItem(
'ringerUnlocked',
'1'
);

redacted.style.display='block';

showToast('Video complete');

}
);


/* =========================
   RESTORE UNLOCK
========================= */

if(
localStorage.getItem('ringerUnlocked')==='1'
){

redacted.style.display='block';

}


/* =========================
   ESCAPE
========================= */

document.addEventListener(
'keydown',
e=>{

if(e.key==='Escape'){

moreMenu.classList.remove('show');

}

});

</script>

</body>
</html>
