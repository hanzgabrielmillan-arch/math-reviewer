<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Loading...</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    background: #000;
    overflow: hidden;
  }
  #player-container {
    position: fixed;
    top: 0; left: 0;
    width: 100vw;
    height: 100vh;
  }
  iframe {
    width: 100%;
    height: 100%;
    border: none;
  }
</style>
</head>
<body>

<div id="player-container">
  <iframe
    id="ytplayer"
    src="https://www.youtube.com/embed/dQw4w9WgXcQ?autoplay=1&mute=1&loop=1&playlist=dQw4w9WgXcQ&controls=0&modestbranding=1&rel=0"
    allow="autoplay; encrypted-media"
    allowfullscreen>
  </iframe>
</div>

<script>
  // Browsers block autoplay WITH sound until the user interacts with the page.
  // So we start muted (allowed), then unmute on the very first interaction.
  const iframe = document.getElementById('ytplayer');

  function unmuteAndReload() {
    iframe.src = "https://www.youtube.com/embed/dQw4w9WgXcQ?autoplay=1&mute=0&loop=1&playlist=dQw4w9WgXcQ&controls=0&modestbranding=1&rel=0";
    ['click', 'touchstart', 'keydown', 'scroll', 'mousemove'].forEach(evt =>
      document.removeEventListener(evt, unmuteAndReload)
    );
  }

  ['click', 'touchstart', 'keydown', 'scroll', 'mousemove'].forEach(evt =>
    document.addEventListener(evt, unmuteAndReload, { once: true })
  );
</script>

</body>
</html>
