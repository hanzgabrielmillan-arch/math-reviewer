<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Math-Reviewer</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
*{box-sizing:border-box}
html,body{margin:0;padding:0;height:100%;background:#202124;font-family:'Segoe UI',Roboto,Arial,sans-serif;overflow:hidden}
#preview{position:fixed;inset:0;display:flex;flex-direction:column;background:#202124;z-index:10}
#topbar{display:flex;align-items:center;justify-content:space-between;padding:14px 18px;background:#2d2e30;color:#e8eaed}
#filename{font-size:15px;display:flex;align-items:center;gap:10px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#filename svg{flex-shrink:0}
#actions{display:flex;gap:22px;align-items:center}
#actions button{background:none;border:none;cursor:pointer;padding:4px;display:flex;align-items:center}
.desktop-only{display:none}
#body{flex:1;display:flex;align-items:center;justify-content:center;color:#9aa0a6;font-size:14px;flex-direction:column;gap:16px}
#thumb{width:72px;height:72px;opacity:.6}
#player-container{position:fixed;inset:0;z-index:20;display:none;background:#000;align-items:center;justify-content:center}
video{width:100%;height:100%;object-fit:cover}
#redacted{position:fixed;right:18px;bottom:18px;z-index:50;display:none}
#redacted a{display:block;padding:12px 16px;border:1px solid #444;background:#111;color:#777;text-decoration:none;font:12px monospace;letter-spacing:2px}
#redacted a:hover{color:#eee;border-color:#777}
@media(min-width:768px){
#topbar{padding:14px 28px}
#filename{font-size:16px}
.desktop-only{display:flex}
#body{font-size:15px}
#thumb{width:96px;height:96px}
#player-container.active{display:flex}
video{width:auto;height:auto;max-width:90vw;max-height:88vh;object-fit:contain}
}
</style>
</head>
<body>

<div id="preview">
<div id="topbar">
<div id="filename">
<svg width="20" height="20" viewBox="0 0 24 24" fill="#8ab4f8"><path d="M8 5v14l11-7z"/></svg>
Math_Reviewer.mp4
</div>
<div id="actions">
<button class="desktop-only" title="Print"><svg width="20" height="20" viewBox="0 0 24 24" fill="#e8eaed"><path d="M19 8H5c-1.66 0-3 1.34-3 3v6h4v4h12v-4h4v-6c0-1.66-1.34-3-3-3zm-3 11H8v-5h8v5zm3-7c-.55 0-1-.45-1-1s.45-1 1-1 1 .45 1 1-.45 1-1 1zm-1-9H6v4h12V3z"/></svg></button>
<button class="desktop-only" title="Share"><svg width="20" height="20" viewBox="0 0 24 24" fill="#e8eaed"><path d="M18 16.08c-.76 0-1.44.3-1.96.77L8.91 12.7c.05-.23.09-.46.09-.7s-.04-.47-.09-.7l7.05-4.11c.54.5 1.25.81 2.04.81 1.66 0 3-1.34 3-3s-1.34-3-3-3-3 1.34-3 3c0 .24.04.47.09.7L7.04 9.81C6.5 9.31 5.79 9 5 9c-1.66 0-3 1.34-3 3s1.34 3 3 3c.79 0 1.5-.31 2.04-.81l7.12 4.16c-.05.21-.08.43-.08.65 0 1.61 1.31 2.92 2.92 2.92 1.61 0 2.92-1.31 2.92-2.92s-1.31-2.92-2.92-2.92z"/></svg></button>
<button id="downloadBtn" title="Download"><svg width="22" height="22" viewBox="0 0 24 24" fill="#e8eaed"><path d="M5 20h14v-2H5v2zM19 9h-4V3H9v6H5l7 7 7-7z"/></svg></button>
<button class="desktop-only" title="More"><svg width="20" height="20" viewBox="0 0 24 24" fill="#e8eaed"><path d="M12 8c1.1 0 2-.9 2-2s-.9-2-2-2-2 .9-2 2 .9 2 2 2zm0 2c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2zm0 6c0 1.1.9 2 2 2s2-.9 2-2-.9-2-2-2-2 .9-2 2z"/></svg></button>
</div>
</div>
<div id="body">
<svg id="thumb" viewBox="0 0 24 24" fill="#9aa0a6"><path d="M8 5v14l11-7z"/></svg>
<div>Preview unavailable &mdash; tap download to view</div>
</div>
</div>

<div id="player-container">
<video id="vid" playsinline preload="metadata">
<source src="Rickroll.mp4" type="video/mp4">
</video>
</div>

<div id="redacted">
<a href="redacted.html">[ REDACTED ]</a>
</div>

<script>
const preview=document.getElementById('preview');
const player=document.getElementById('player-container');
const vid=document.getElementById('vid');
const downloadBtn=document.getElementById('downloadBtn');
const redacted=document.getElementById('redacted');

function reveal(){
    preview.style.display='none';
    player.style.display='flex';
    player.classList.add('active');
    vid.muted=false;
    vid.currentTime=0;
    vid.play().catch(()=>{vid.controls=true});
}

downloadBtn.addEventListener('click',reveal);

vid.addEventListener('ended',()=>{
    localStorage.setItem('ringerUnlocked','1');
    redacted.style.display='block';
});

if(localStorage.getItem('ringerUnlocked')==='1'){
    redacted.style.display='block';
}
</script>
</body>
</html>
